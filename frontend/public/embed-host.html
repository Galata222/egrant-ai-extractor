<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <title>eGrant host</title>
  </head>
  <body>
    <p id="status">Čakám na potvrdenie z iframe.</p>
    <iframe src="/embed" title="Overenie dokladu" style="width: 100%; height: 85vh; border: 1px solid #d6d3d1"></iframe>
    <script>
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "egrant:fill") {
          document.getElementById("status").textContent =
            "egrant:fill " + event.data.payload.contract;
        }
      });
    </script>
  </body>
</html>
